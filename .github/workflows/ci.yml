name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` input: the action reads `packageManager` from package.json,
      # so CI runs exactly the pnpm the repository pins.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # dist/antibody.mjs is committed because a Claude Code plugin runs it
      # straight from git. A source change without a rebuilt bundle fails here.
      - name: Bundle is up to date
        run: git diff --exit-code -- dist/

      # The M2 check against the committed bundle: a fix recorded in one
      # worktree reaches a session in another within a second. Hook latency is
      # printed, not enforced: shared runners are too noisy for a 50 ms gate.
      - name: End-to-end
        run: pnpm run e2e -- --samples 5
